<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <i class="fas fa-truck-fast logo-icon"></i>
            <h2>SmartLogi</h2>
            <p class="text-muted">Connectez-vous à votre compte</p>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <!-- Username -->
            <div class="mb-3">
                <label for="username" class="form-label">Nom d'utilisateur</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                    <input type="email" class="form-control" id="username" formControlName="username"
                        [class.is-invalid]="isFieldInvalid('username')" placeholder="Entrez votre email d'utilisateur">
                </div>
                <div class="invalid-feedback d-block" *ngIf="isFieldInvalid('username')">
                    {{ getError('username') }}
                </div>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label for="password" class="form-label">Mot de passe</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input [type]="showPassword ? 'text' : 'password'" class="form-control" id="password"
                        formControlName="password" [class.is-invalid]="isFieldInvalid('password')"
                        placeholder="Entrez votre mot de passe">
                    <button type="button" class="btn btn-outline-secondary" (click)="togglePassword()">
                        <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
                    </button>
                </div>
                <div class="invalid-feedback d-block" *ngIf="isFieldInvalid('password')">
                    {{ getError('password') }}
                </div>
            </div>

            <!-- Forgot Password -->
            <div class="mb-3 text-end">
                <a routerLink="/forgot-password" class="text-decoration-none">Mot de passe oublié ?</a>
            </div>

            <!-- Submit Button -->
            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-primary btn-lg" [disabled]="isLoading">
                    <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
                    <i *ngIf="!isLoading" class="fas fa-sign-in-alt me-2"></i>
                    {{ isLoading ? 'Connexion...' : 'Se connecter' }}
                </button>
            </div>
        </form>

        <!-- Divider -->
        <div class="divider">
            <span>OU</span>
        </div>

        <!-- OAuth2 Buttons -->
        <div class="oauth-buttons">
            <button type="button" class="btn btn-outline-dark btn-lg w-100 mb-2" (click)="loginWithGoogle()">
                <i class="fab fa-google me-2 text-danger"></i>
                Continuer avec Google
            </button>
            <button type="button" class="btn btn-dark btn-lg w-100" (click)="loginWithGitHub()">
                <i class="fab fa-github me-2"></i>
                Continuer avec GitHub
            </button>
        </div>

        <!-- Register Link -->
        <div class="text-center mt-4">
            <p class="mb-0">
                Pas encore de compte ?
                <a routerLink="/register" class="text-decoration-none fw-bold">S'inscrire</a>
            </p>
        </div>
    </div>
</div>
