<div class="register-container">
    <div class="register-card">
        <div class="register-header">
            <i class="fas fa-truck-fast logo-icon"></i>
            <h2>SmartLogi</h2>
            <p class="text-muted">Créez votre compte</p>
        </div>

        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
            <div class="row">
                <!-- First Name -->
                <div class="col-md-6 mb-3">
                    <label for="firstName" class="form-label">Prénom *</label>
                    <input type="text" class="form-control" id="firstName" formControlName="firstName"
                        [class.is-invalid]="isFieldInvalid('firstName')" placeholder="Prénom">
                    <div class="invalid-feedback" *ngIf="isFieldInvalid('firstName')">
                        {{ getError('firstName') }}
                    </div>
                </div>

                <!-- Last Name -->
                <div class="col-md-6 mb-3">
                    <label for="lastName" class="form-label">Nom *</label>
                    <input type="text" class="form-control" id="lastName" formControlName="lastName"
                        [class.is-invalid]="isFieldInvalid('lastName')" placeholder="Nom">
                    <div class="invalid-feedback" *ngIf="isFieldInvalid('lastName')">
                        {{ getError('lastName') }}
                    </div>
                </div>
            </div>

            <!-- Username -->
            <div class="mb-3">
                <label for="username" class="form-label">Nom d'utilisateur *</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                    <input type="text" class="form-control" id="username" formControlName="username"
                        [class.is-invalid]="isFieldInvalid('username')" placeholder="Choisissez un nom d'utilisateur">
                </div>
                <div class="invalid-feedback d-block" *ngIf="isFieldInvalid('username')">
                    {{ getError('username') }}
                </div>
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label for="email" class="form-label">Email *</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                    <input type="email" class="form-control" id="email" formControlName="email"
                        [class.is-invalid]="isFieldInvalid('email')" placeholder="votre@email.com">
                </div>
                <div class="invalid-feedback d-block" *ngIf="isFieldInvalid('email')">
                    {{ getError('email') }}
                </div>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label for="password" class="form-label">Mot de passe *</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input [type]="showPassword ? 'text' : 'password'" class="form-control" id="password"
                        formControlName="password" [class.is-invalid]="isFieldInvalid('password')"
                        placeholder="Minimum 8 caractères">
                    <button type="button" class="btn btn-outline-secondary" (click)="togglePassword()">
                        <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
                    </button>
                </div>
                <div class="invalid-feedback d-block" *ngIf="isFieldInvalid('password')">
                    {{ getError('password') }}
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirmer le mot de passe *</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input [type]="showPassword ? 'text' : 'password'" class="form-control" id="confirmPassword"
                        formControlName="confirmPassword" [class.is-invalid]="isFieldInvalid('confirmPassword')"
                        placeholder="Confirmez votre mot de passe">
                </div>
                <div class="invalid-feedback d-block" *ngIf="isFieldInvalid('confirmPassword')">
                    {{ getError('confirmPassword') }}
                </div>
            </div>

            <!-- Phone (Optional) -->
            <div class="mb-3">
                <label for="phone" class="form-label">Téléphone</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-phone"></i></span>
                    <input type="tel" class="form-control" id="phone" formControlName="phone"
                        placeholder="+212 6XX XXX XXX">
                </div>
            </div>

            <!-- Submit Button -->
            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-primary btn-lg" [disabled]="isLoading">
                    <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
                    <i *ngIf="!isLoading" class="fas fa-user-plus me-2"></i>
                    {{ isLoading ? 'Inscription...' : 'S\'inscrire' }}
                </button>
            </div>
        </form>

        <!-- Login Link -->
        <div class="text-center mt-3">
            <p class="mb-0">
                Déjà un compte ?
                <a routerLink="/login" class="text-decoration-none fw-bold">Se connecter</a>
            </p>
        </div>
    </div>
</div>
